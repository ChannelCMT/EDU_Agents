    source_id: "knowledge-base-builder"
    primary_output: "可构建的 Vibestar VitePress 学习资料站"
    validation:
      command: "npm run build"

maintenance_rule: "每次新增或修改 Agent 都要同步更新分类说明、Agent 契约、使用流程和变更记录"
