    primary_output: "可验证、可复用的分章课程视频生产流程"
    validation:
      command: "python course-video-pipeline/scripts/validate_course_video.py ."
  - id: "entrepreneur.vibestar-frontend-maintainer"
    path: "vibestar-frontend-maintainer"
